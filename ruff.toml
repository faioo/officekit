# Ruff configuration for OfficeKit.
# Targets the oldest supported runtime so syntax stays compatible with CI.
target-version = "py39"
line-length = 100

[lint]
# Default rule set (pyflakes + a safe subset of pycodestyle) keeps the gate
# focused on real defects (unused imports, undefined names, f-string misuse).
select = ["E4", "E7", "E9", "F"]
