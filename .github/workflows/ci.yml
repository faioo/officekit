name: CI and Automated Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v0.1.3'
        required: true
        default: 'v0.1.3'
      build_macos:
        description: 'Build macOS app'
        required: true
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows app'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Code Quality and Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: |
          PYTHONPATH=src pytest

  build:
    name: Build & Release Desktop App
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    steps:
      - name: Check out repository
        if: github.event_name != 'workflow_dispatch' || (matrix.platform == 'mac' && inputs.build_macos) || (matrix.platform == 'win' && inputs.build_windows)
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name != 'workflow_dispatch' || (matrix.platform == 'mac' && inputs.build_macos) || (matrix.platform == 'win' && inputs.build_windows)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || (matrix.platform == 'mac' && inputs.build_macos) || (matrix.platform == 'win' && inputs.build_windows)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install macOS vendor tools
        if: matrix.os == 'macos-latest' && (github.event_name != 'workflow_dispatch' || inputs.build_macos)
        run: |
          brew install --cask libreoffice
          brew install poppler

      - name: Install Windows vendor tools
        if: matrix.os == 'windows-latest' && (github.event_name != 'workflow_dispatch' || inputs.build_windows)
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/oschwartz10612/poppler-windows/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '^Release-.*\.zip$' } | Select-Object -First 1
          if (-not $asset) {
            throw "Could not find a Poppler Windows release zip asset."
          }

          $archive = Join-Path $env:RUNNER_TEMP "poppler.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "poppler"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractDir -Force

          $pdftoppm = Get-ChildItem -Path $extractDir -Recurse -Filter "pdftoppm.exe" | Select-Object -First 1
          if (-not $pdftoppm) {
            throw "Downloaded Poppler archive did not contain pdftoppm.exe."
          }

          $popplerRoot = $pdftoppm.Directory.Parent.FullName
          "POPPLER_HOME=$popplerRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          $pdftoppm.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append
          & $pdftoppm.FullName -v

      - name: Package Application
        if: github.event_name != 'workflow_dispatch' || (matrix.platform == 'mac' && inputs.build_macos) || (matrix.platform == 'win' && inputs.build_windows)
        run: |
          python build_app.py --platform ${{ matrix.platform }}

      - name: Prepare Windows upload artifact name
        if: matrix.os == 'windows-latest' && (github.event_name != 'workflow_dispatch' || inputs.build_windows)
        shell: bash
        run: |
          # Rename Windows full ZIP to release version tag
          mv dist/OfficeKit_Windows_v0.1.0.zip "dist/OfficeKit_Windows_${RELEASE_VERSION}.zip"

      - name: Prepare macOS upload artifact name
        if: matrix.os == 'macos-latest' && (github.event_name != 'workflow_dispatch' || inputs.build_macos)
        shell: bash
        run: |
          # Rename Zip to release version tag
          mv dist/OfficeKit_macOS_v0.1.0.zip "dist/OfficeKit_macOS_${RELEASE_VERSION}.zip"

      - name: Upload binaries to GitHub Release
        if: github.event_name != 'workflow_dispatch' || (matrix.platform == 'mac' && inputs.build_macos) || (matrix.platform == 'win' && inputs.build_windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/OfficeKit_Windows_*.zip
            dist/OfficeKit_macOS_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
