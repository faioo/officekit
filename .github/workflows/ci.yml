name: CI and Automated Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Code Quality and Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: |
          PYTHONPATH=src pytest

  build:
    name: Build & Release Desktop App
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install macOS vendor tools
        if: matrix.os == 'macos-latest'
        run: |
          brew install --cask libreoffice
          brew install poppler

      - name: Install Windows vendor tools
        if: matrix.os == 'windows-latest'
        run: |
          choco install libreoffice-fresh poppler -y --no-progress

      - name: Package Application
        run: |
          python build_app.py --platform ${{ matrix.platform }}

      - name: Prepare Windows upload artifact name
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Rename Windows full ZIP to release version tag
          mv dist/OfficeKit_Windows_v0.1.0.zip dist/OfficeKit_Windows_${{ github.ref_name }}.zip

      - name: Prepare macOS upload artifact name
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # Rename Zip to release version tag
          mv dist/OfficeKit_macOS_v0.1.0.zip dist/OfficeKit_macOS_${{ github.ref_name }}.zip

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OfficeKit_Windows_*.zip
            dist/OfficeKit_macOS_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
